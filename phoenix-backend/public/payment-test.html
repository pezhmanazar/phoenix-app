
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="origin">
  <title>آزمایش درگاه ققنوس</title>
  <style>
    body {
      background: #0b0f14;
      color: #fff;
      font-family: Tahoma, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      max-width: 600px;
      padding: 15px;
      margin: 12px auto;
      border-radius: 10px;
      font-size: 15px;
      display: block;
    }
    button {
      background: #d4af37;
      color: #111;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>آزمایش درگاه پرداخت ققنوس</h2>
  <p>لینک یک تراکنش تازه زرین‌پال را وارد کنید.</p>

  <input
    id="gateway"
    type="url"
    placeholder="https://payment.zarinpal.com/pg/StartPay/..."
  >

  <button onclick="openGateway()">ورود به درگاه</button>

  <script>
    function openGateway() {
      const value = document.getElementById("gateway").value.trim();

      try {
        const url = new URL(value);

        if (
          url.protocol !== "https:" ||
          url.hostname !== "payment.zarinpal.com" ||
          !url.pathname.startsWith("/pg/StartPay/")
        ) {
          alert("آدرس معتبر زرین‌پال را وارد کنید.");
          return;
        }

        window.location.assign(url.href);
      } catch {
        alert("آدرس واردشده معتبر نیست.");
      }
    }
  </script>
</body>
</html>
