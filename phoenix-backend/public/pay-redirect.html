<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="origin" />
    <meta name="robots" content="noindex, nofollow" />

    <title>درگاه پرداخت | ققنوس</title>

    <link rel="icon" type="image/png" href="/static/img/favicon.png" />

    <style>
      @font-face {
        font-family: "Anjoman";
        src: url("/fonts/anjoman/Anjoman-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Anjoman";
        src: url("/fonts/anjoman/Anjoman-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Anjoman";
        src: url("/fonts/anjoman/Anjoman-Bold.ttf") format("truetype");
        font-weight: 700 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #0b0f14;
        --text: #e8ecf1;
        --muted: #9aa4b2;
        --gold: #d4af37;
        --orange: #e98a15;
        --border: rgba(255, 255, 255, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;

        font-family:
          "Anjoman",
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;

        background: var(--bg);
        color: var(--text);
        line-height: 2;
        overflow: hidden;
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }

      .glow {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 999px;
        filter: blur(70px);
        opacity: 0.22;
      }

      .glow.gold {
        top: -180px;
        right: -180px;
        background: radial-gradient(circle, var(--gold), transparent 60%);
      }

      .glow.orange {
        bottom: -200px;
        left: -180px;
        background: radial-gradient(circle, var(--orange), transparent 60%);
        opacity: 0.18;
      }

      .card {
        position: relative;
        width: min(420px, 100%);
        padding: 28px 22px;
        overflow: hidden;

        text-align: center;

        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.02)
        );

        border: 1px solid var(--border);
        border-radius: 24px;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      .logo {
        height: 52px;
        display: block;
        margin: 0 auto 20px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 21px;
        font-weight: 900;
        letter-spacing: -0.2px;
      }

      button {
        width: 100%;
        min-height: 56px;
        padding: 14px 18px;

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;

        font-family: inherit;
        font-size: 14px;
        font-weight: 900;

        color: #101419;

        background: linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.95),
          rgba(233, 138, 21, 0.95)
        );

        box-shadow: 0 14px 35px rgba(212, 175, 55, 0.14);

        cursor: pointer;
        transition: 0.2s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .error {
        margin: 0;
        color: #fca5a5;
        font-size: 13px;
        line-height: 1.9;
      }
    </style>
  </head>

  <body>
    <div class="bg">
      <div class="glow gold"></div>
      <div class="glow orange"></div>
    </div>

    <main class="card">
      <img class="logo" src="/static/img/logo.png" alt="ققنوس" />

      <h1 id="title">درگاه پرداخت ققنوس</h1>

      <p id="errorMessage" class="error" hidden></p>

      <button id="payButton" type="button" disabled>ورود به درگاه امن</button>
    </main>

    <script>
      (function () {
        "use strict";

        const button = document.getElementById("payButton");
        const title = document.getElementById("title");
        const errorMessage = document.getElementById("errorMessage");

        const params = new URLSearchParams(window.location.search);
        const authority = params.get("authority") || "";

        const isValidAuthority = /^A[0-9A-Za-z]{35}$/.test(authority);

        if (!isValidAuthority) {
          title.textContent = "خطا در پرداخت";
          errorMessage.textContent =
            "اطلاعات تراکنش معتبر نیست. دوباره از داخل اپ اقدام کن.";
          errorMessage.hidden = false;
          button.style.display = "none";
          return;
        }

        const gatewayUrl =
          "https://payment.zarinpal.com/pg/StartPay/" +
          encodeURIComponent(authority);

        button.disabled = false;

        button.addEventListener("click", function () {
          button.disabled = true;
          button.textContent = "در حال انتقال...";

          window.location.assign(gatewayUrl);
        });
      })();
    </script>
  </body>
</html>
