
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex, nofollow">
  <title>انتقال به درگاه پرداخت | ققنوس</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b0f14;
      color: #f9fafb;
      font-family: Tahoma, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border: 1px solid rgba(212, 175, 55, .28);
      border-radius: 20px;
      background: #141a22;
    }

    h1 {
      margin: 0 0 16px;
      color: #d4af37;
      font-size: 23px;
    }

    p {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 2;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #d4af37;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .error {
      color: #fca5a5;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>درگاه پرداخت ققنوس</h1>

    <p id="message">
      برای ادامه خرید اشتراک، روی دکمه زیر بزن.
    </p>

    <button id="payButton" type="button" disabled>
      ورود به درگاه امن
    </button>

    <p class="note">
      پرداخت در وب‌سایت زرین‌پال انجام می‌شود.
    </p>
  </main>

  <script>
    (function () {
      "use strict";

      const button = document.getElementById("payButton");
      const message = document.getElementById("message");

      const params = new URLSearchParams(window.location.search);
      const authority = params.get("authority") || "";

      // اعتبارسنجی قالب Authority؛
      // اعتبار واقعی تراکنش در زرین‌پال بررسی می‌شود.
      const isValidAuthority = /^A[0-9A-Za-z]{35}$/.test(authority);

      if (!isValidAuthority) {
        message.textContent =
          "اطلاعات تراکنش معتبر نیست. لطفاً از داخل اپ دوباره اقدام کن.";

        message.classList.add("error");
        button.style.display = "none";
        return;
      }

      const gatewayUrl =
        "https://payment.zarinpal.com/pg/StartPay/" +
        encodeURIComponent(authority);

      button.disabled = false;

      button.addEventListener("click", function () {
        button.disabled = true;
        button.textContent = "در حال انتقال...";

        // هدایت با کلیک کاربر از مبدأ qoqnoos.app
        window.location.assign(gatewayUrl);
      });
    })();
  </script>
</body>
</html>
